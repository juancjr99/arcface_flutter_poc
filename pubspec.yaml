name: arcface_flutter_poc
description: POC de reconocimiento facial ArcFace
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  built_collection: ">=5.1.1 <6.0.0"
  built_value: ">=8.4.0 <9.0.0"
  camera: ^0.11.0
